spring.application.name=devquiz-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=devquiz;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Em produção, defina JWT_SECRET com uma chave aleatória de pelo menos 32 caracteres.
devquiz.jwt.secret=${JWT_SECRET:devquiz-local-secret-key-change-before-production-2026}
devquiz.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
